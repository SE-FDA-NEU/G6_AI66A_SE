<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title">
<title id="title">Workspace states</title><rect width="1100" height="510" fill="white"/>
<g font-family="Arial, sans-serif">
<text x="28" y="40" font-size="25" font-weight="bold" fill="#273044">Workspace: empty, loading, error and data</text>
<rect x="28" y="72" width="508" height="184" rx="8" fill="#f5f4ff" stroke="#b9b1dc"/><text x="46" y="102" font-size="19" font-weight="normal" fill="#273044">Empty</text><text x="46" y="129" font-size="19" font-weight="normal" fill="#273044"></text><text x="46" y="156" font-size="19" font-weight="normal" fill="#273044">No documents yet.</text><text x="46" y="183" font-size="19" font-weight="normal" fill="#273044">[Upload documents]</text>
<rect x="564" y="72" width="508" height="184" rx="8" fill="#f5f4ff" stroke="#b9b1dc"/><text x="582" y="102" font-size="19" font-weight="normal" fill="#273044">Loading</text><text x="582" y="129" font-size="19" font-weight="normal" fill="#273044"></text><text x="582" y="156" font-size="19" font-weight="normal" fill="#273044">Loading your documents...</text><text x="582" y="183" font-size="19" font-weight="normal" fill="#273044">Keep the current query visible.</text>
<rect x="28" y="280" width="508" height="184" rx="8" fill="#f5f4ff" stroke="#b9b1dc"/><text x="46" y="310" font-size="19" font-weight="normal" fill="#273044">Error</text><text x="46" y="337" font-size="19" font-weight="normal" fill="#273044"></text><text x="46" y="364" font-size="19" font-weight="normal" fill="#273044">Could not load documents.</text><text x="46" y="391" font-size="19" font-weight="normal" fill="#273044">[Retry] Keep the current selection.</text>
<rect x="564" y="280" width="508" height="184" rx="8" fill="#f5f4ff" stroke="#b9b1dc"/><text x="582" y="310" font-size="19" font-weight="normal" fill="#273044">Data</text><text x="582" y="337" font-size="19" font-weight="normal" fill="#273044"></text><text x="582" y="364" font-size="19" font-weight="normal" fill="#273044">[contract.pdf] AI label: Contract 87%</text><text x="582" y="391" font-size="19" font-weight="normal" fill="#273044">Search hit: excerpt + [source page]</text>
</g></svg>