name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

# Cancel an in-progress run when new commits are pushed to the same branch,
# so a busy sprint week does not exhaust the org's Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install document conversion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress fonts-noto-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest tests -v --junitxml=test-results/backend-junit.xml

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/test-results/
          retention-days: 14
          if-no-files-found: error

  node:
    name: Node build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      CI: "true"
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install API test server dependencies
        run: python -m pip install -r ../backend/requirements-dev.txt

      - name: Install frontend dependencies
        id: npm
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium and WebKit with system dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit

      - name: Test
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: |
          mkdir -p test-results
          npm run build 2>&1 | tee test-results/build.log

      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-and-build-reports
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: error

  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for obvious credentials
        run: |
          # Deliberately simple and readable - students should be able to read this
          # and understand why their commit was blocked.
          PATTERN='(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----|password\s*=\s*["'"'"'][^"'"'"']{6,})'
          if git grep -nIE "$PATTERN" -- . ':!*.md' ':!.github/workflows/*' ; then
            echo "::error::A credential-looking string was found. Move it to an environment variable and rotate the key."
            exit 1
          fi
          echo "Clean."

      - name: No .env or database dumps
        run: |
          if git ls-files | grep -E '^(.*/)?\.env$|\.sql$|\.sqlite3?$|\.dump$' ; then
            echo "::error::Environment files or database dumps must not be committed. Add them to .gitignore."
            exit 1
          fi
          echo "Clean."
